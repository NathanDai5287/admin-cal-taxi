<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="color-scheme" content="light"><title>Timeline first · Hosting concept</title><style>

olor:var(--green)}.step.done .step-point:after{content:"";position:absolute;width:7px;height:4px;border-bottom:1.5px solid white;border-left:1.5px solid white;transform:rotate(-45deg);top:4px;left:4px}.step.current .step-point{border:4px solid var(--blue)}.step-top{display:flex;justify-content:space-between;gap:12px;align-items:baseline}.step p{font-size:12px;color:var(--muted);margin:5px 0 10px;max-width:65ch}.step time{font-size:11px;color:var(--muted);white-space:nowrap}.step .actions button{font-size:12px;padding:7px 10px}.people{list-style:none;margin:0;padding:0}.person{padding:13px 0;display:flex;justify-content:space-between;gap:12px;align-items:center;border-bottom:1px solid var(--line)}.person:last-child{border:0}.person p{font-size:12px;color:var(--muted);overflow-wrap:anywhere}.person strong{font-size:13px;font-weight:600}.person .text{font-size:12px}.person-status{font-size:11px}.money-row{padding:17px 0;border-bottom:1px solid var(--line)}.money-row:first-child{padding-top:0}.money-row:last-child{border:0;padding-bottom:0}.money-top{display:flex;justify-content:space-between;gap:12px;margin-bottom:6px}.money-value{font-size:18px;letter-spacing:-.02em;font-weight:600}.money-row p{font-size:12px;margin-bottom:12px}.payment-form{display:grid;grid-template-columns:1fr 1fr auto;gap:9px;align-items:end;margin-top:12px}.payment-form label{font-size:11px;color:var(--muted);display:grid;gap:5px}.payment-form input{border:1px solid #bdc9d1;border-radius:4px;padding:8px;width:100%;min-width:0}.payment-form button{font-size:12px}.sidebar .payment-form{grid-template-columns:1fr 1fr}.sidebar .payment-form button{grid-column:1/-1}.sidebar h2{font-size:15px}.note{font-size:12px;color:var(--muted);line-height:1.55;margin-top:14px}.activity{list-style:none;padding:0;margin:0}.activity li{padding:10px 0;border-bottom:1px solid var(--line);font-size:12px;line-height:1.5}.activity li:last-child{border:0}.activity time{display:block;font-size:11px;color:var(--muted)}.email-shell{background:#eef1f4;padding:22px}.email-meta{font-size:12px;line-height:1.75;margin-bottom:18px;overflow-wrap:anywhere}.email-paper{max-width:620px;margin:auto;background:white;border:1px solid var(--line);padding:32px;color:#1d2a34}.email-paper h3{font-size:21px;letter-spacing:-.025em;margin:22px 0 18px}.email-paper p{margin-bottom:17px;font-size:13px;line-height:1.75}.email-paper .mail-brand{font-size:15px;font-weight:700;border-bottom:1px solid var(--line);padding-bottom:18px}.email-paper .mail-button{display:inline-block;background:var(--blue);color:#fff;text-decoration:none;font-weight:600;padding:11px 17px;border-radius:4px;font-size:13px;margin:2px 0 19px}.mail-details{border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:12px 0;margin:0 0 20px;font-size:12px;line-height:1.8}.signature{margin-top:25px;padding-top:18px;border-top:1px solid var(--line);font-size:12px;line-height:1.75}.signature strong{font-size:13px}.attachments{font-size:12px;margin-top:15px;color:var(--muted)}.email-disclaimer{font-size:11px;margin-top:18px;color:var(--muted)}.email-section details>summary{padding:16px 22px;cursor:pointer;font-weight:600;color:var(--blue);font-size:13px}.tabs{display:flex;gap:25px;border-bottom:1px solid var(--line);margin-bottom:24px;overflow:auto}.tabs button{border:0;border-bottom:2px solid transparent;border-radius:0;background:none;padding:13px 1px;white-space:nowrap;color:var(--muted)}.tabs button.active{color:var(--blue);border-bottom-color:var(--blue)}.table-scroll{overflow:auto}table{border-collapse:collapse;width:100%;text-align:left;font-size:13px}th{font-size:11px;color:var(--muted);font-weight:600;background:#f8fafb}th,td{padding:15px 20px;border-bottom:1px solid var(--line)}tr:last-child td{border:0}td p{font-size:12px;color:var(--muted);margin-top:4px}td:last-child{text-align:right}.compact .layout{grid-template-columns:minmax(0,1fr) 360px}.compact .facts{margin-bottom:18px}.compact .section-head{padding:15px 20px}.compact .email-paper{font-family:Georgia,serif}.compact .email-paper .mail-brand{font-family:Inter,-apple-system,sans-serif}.workspace .main{max-width:1280px}.workspace .layout{grid-template-columns:minmax(0,1fr) 310px}.workspace .email-paper .mail-brand{color:var(--blue)}.progress-line{display:flex;border-bottom:1px solid var(--line);margin:0 0 24px;padding:16px 0;gap:8px;flex-wrap:wrap}.progress-line span{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:8px}.progress-line span:not(:last-child):after{content:"";width:32px;height:1px;background:#c6cfd7}.progress-line .active{color:var(--blue);font-weight:600}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);padding:12px 18px;background:#17232f;color:#fff;border-radius:6px;max-width:calc(100vw - 32px);font-size:13px;box-shadow:0 5px 18px #17232f22;z-index:20}.toast:empty{display:none}.comparison{max-width:1000px;margin:55px auto;padding:0 24px}.comparison h1{font-size:34px}.comparison>p{margin:15px 0 35px;max-width:65ch;color:var(--muted)}.option{display:grid;grid-template-columns:90px 1fr auto;align-items:center;gap:24px;background:#fff;padding:25px;border-top:1px solid var(--line);text-decoration:none;color:var(--ink)}.option:first-of-type{border-radius:7px 7px 0 0}.option:last-of-type{border-bottom:1px solid var(--line);border-radius:0 0 7px 7px}.option:hover{background:#f9fcfd}.option h2{margin-bottom:6px}.option p{font-size:13px;color:var(--muted)}.wire{height:70px;display:grid;gap:5px;align-content:start;border:1px solid #c4d2dc;padding:7px}.wire i{background:#dfe8ee;height:7px;display:block}.wire i:nth-child(2){background:#9dbccd;width:60%}.option .open{font-size:13px;color:var(--blue);font-weight:600;white-space:nowrap}[hidden]{display:none!important}@media(max-width:800px){.layout,.compact .layout,.workspace .layout{grid-template-columns:1fr}.sidebar .payment-form{grid-template-columns:1fr 1fr auto}.sidebar .payment-form button{grid-column:auto}.main{padding:20px 16px 35px}.nav{padding:15px 16px;gap:18px}.title{flex-direction:column;gap:14px}.title-actions{width:100%}.facts{gap:10px 22px}.fact{width:calc(50% - 11px);font-size:12px;flex-direction:column;gap:4px}.step-top{flex-wrap:wrap;gap:5px}.section-head,.section-body{padding:17px}.prototype{padding:9px 16px}.prototype a{margin-left:0}.email-shell{padding:12px}.email-paper{padding:22px}.option{grid-template-columns:60px 1fr;padding:20px 15px;gap:15px}.option .open{grid-column:2}.comparison{margin-top:30px}.comparison h1{font-size:28px}th,td{padding:13px}.progress-line span:not(:last-child):after{width:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body class="timeline" data-variant="timeline"><div class="prototype"><strong>Timeline first</strong><span>Interactive concept · sample data · no emails sent</span><a href="index.html">Compare directions</a></div><header><nav class="nav" aria-label="Hosting"><span class="brand"><span class="mark">ΘΞ</span>Theta Xi Hosting</span><a href="index.html">Create</a><a class="selected" href="index.html">Orders</a><a href="index.html">Email</a></nav></header><div id="app"></div><div class="toast" role="status" aria-live="polite"></div><script>(function runtime() {
 const variant = document.body.dataset.variant;
 const state = {sent:true,count:2,held:false,cancelled:false,rental:500,permit:0,email:'reminder',tab:'timeline',form:null,docs:new Set(['contract']),reminded:new Set(),activity:[['Oct 3, 10:42 AM','Jordan Chen signed the contract.'],['Oct 3, 9:16 AM','Alex Rivera signed the contract.'],['Oct 2, 2:30 PM','Contract emailed to all five representatives.']]};
 const people=['Alex Rivera','Jordan Chen','Sam Patel','Casey Morgan','Taylor Lee'];
 const money=n=>n.toLocaleString('en-US',{style:'currency',currency:'USD',maximumFractionDigits:2});
 const safe=t=>String(t).replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('"','&quot;');
 const btn=(text,action,primary=false,disabled=false)=>`<button ${disabled?'disabled':''} class="${primary?'primary':''}" data-action="${action}">${text}</button>`;
 const stage=()=>state.cancelled?'Cancelled':!state.sent?'Draft':state.held?`Event held · ${state.count}/5 signed`:state.count===5?'Signed · 5/5 signed':`Sent · ${state.count}/5 signed`;
 const log=t=>state.activity.unshift(['Just now',t]);
 let toastTimer;
 function toast(t){document.querySelector('.toast').textContent=t;clearTimeout(toastTimer);toastTimer=setTimeout(()=>{document.querySelector('.toast').textContent=''},5000)}
 function finance(){return `<section class="section"><div class="section-head"><div><h2>Finances</h2><p>Record payments as they happen.</p></div></div><div class="section-body">${[['rental','Rental fee',1400,state.rental,'Hosting income'],['permit','Fire permit',125,state.permit,'Socials expense']].map(([kind,label,total,paid,category])=>`<div class="money-row"><div class="money-top"><h3>${label}</h3><span class="small ${paid>=total?'green':'muted'}">${paid>=total?'Paid':paid>0?'Partially paid':'Unpaid'}</span></div><div class="money-value tabular">${money(paid)} <span class="muted small">of ${money(total)}</span></div><p>${money(Math.max(0,total-paid))} remaining · ${category}</p>${state.form===kind?`<form class="payment-form" data-kind="${kind}"><label>Amount ($)<input name="amount" type="number" min="0.01" max="${total-paid}" step="0.01" value="${total-paid}" required></label><label>Payment date<input name="date" type="date" value="2026-10-03" required></label><button class="primary" type="submit">Record</button></form>`:btn(paid>=total?'Paid in full':'Record payment','pay-'+kind,false,paid>=total||state.cancelled)}${kind==='rental'&&paid>0?` <button class="text small" data-action="preview-receipt">Preview receipt</button>`:''}</div>`).join('')}<p class="note">Sending documents never records a payment. Fire-permit payments appear under Socials.</p></div></section>`}
 function signerRows(){return people.map((name,i)=>`<li class="person"><div><strong>${name}</strong><p>person${i+1}@example.test</p></div><div><span class="person-status ${i<state.count?'green':'muted'}">${i<state.count?'Signed':state.cancelled?'Cancelled':state.sent?'Awaiting signature':'Not sent'}</span>${i>=state.count&&state.sent&&!state.cancelled?`<br><button class="text" data-action="remind-${i}" ${state.reminded.has(i)?'disabled':''}>${state.reminded.has(i)?'Reminder sent':'Remind'}</button>`:''}</div></li>`).join('')}
 function signers(){return `<section class="section"><div class="section-head"><div><h2>Contract recipients</h2><p>Signature progress comes from Documenso.</p></div>${btn('Remind unsigned signers','remind',false,!state.sent||state.count===5||state.cancelled)}</div><div class="section-body"><ul class="people">${signerRows()}</ul></div></section>`}
 function activity(){return `<section class="section"><div class="section-head"><h2>Activity</h2></div><div class="section-body"><ul class="activity">${state.activity.slice(0,6).map(([date,text])=>`<li><time>${safe(date)}</time>${safe(text)}</li>`).join('')}</ul></div></section>`}
 function steps(){return [
  {name:'Prepare your agreement',date:'Before sending',detail:'Review the people, rental fee, deposit, and contract terms.',done:true,action:btn('Preview contract email','preview-contract')},
  {name:'Send contract for signatures',date:state.sent?'Sent Oct 2':'Ready to send',detail:state.sent?`Emailed to five people. ${state.count} of 5 have signed.`:'Each person receives their own private signing link.',done:state.sent,current:!state.sent,action:state.sent?btn('Remind unsigned signers','remind',false,state.count===5||state.cancelled):btn('Send contract to all signers','send-contract',true,state.cancelled)},
  {name:'Everyone signs',date:state.count===5?'Complete':'Waiting for signatures',detail:state.count===5?'The completed contract has been emailed to all five people.':'Documenso updates this automatically. The completed copy is emailed when everyone signs.',done:state.count===5,current:state.sent&&state.count<5,action:btn('View recipients','show-signers')},
  {name:'Request the security deposit',date:'Due Oct 9 · 7 days before',detail:'Send the $300 deposit invoice before payment is due.',done:state.docs.has('deposit'),action:btn(state.docs.has('deposit')?'Resend deposit invoice':'Send deposit invoice','send-deposit',false,state.cancelled)+btn('Preview email','preview-deposit')},
  {name:'Pay the fire permit',date:'Before Oct 16',detail:state.permit>=125?'$125 payment recorded under Socials.':'Record the permit payment under Socials when paid.',done:state.permit>=125,action:btn(state.permit>=125?'Permit paid':'Record permit payment','pay-permit',false,state.permit>=125||state.cancelled)},
  {name:'Event held',date:'Oct 16 · 7–11 PM',detail:'Changes automatically after Oct 16 in Los Angeles time, unless cancelled.',done:state.held&&state.sent&&!state.cancelled,action:''},
  {name:'Collect the rental fee',date:'Due Oct 18 · 2 days after',detail:`${money(state.rental)} of $1,400 received. Send the invoice whenever you are ready.`,done:state.rental>=1400,action:btn(state.docs.has('rental')?'Resend rental invoice':'Send rental invoice','send-rental',false,state.cancelled)+btn('Preview email','preview-rental')},
  {name:'Send receipt and return deposit',date:'After full rental payment',detail:'Send a receipt for payments received. Send refund confirmation after the deposit is actually returned.',done:state.docs.has('refund'),action:btn('Send payment receipt','send-receipt',false,state.rental===0||state.cancelled)+btn('Preview refund confirmation','preview-refund',false,state.rental<1400||state.cancelled)}
 ]}
 function timeline(){return `<section class="section"><div class="section-head"><div><h2>Event timeline</h2><p>Automatic milestones and the documents to send next.</p></div></div><div class="section-body"><ol class="step-list">${steps().map(s=>`<li class="step ${s.done?'done':s.current?'current':''}"><span class="step-point" aria-hidden="true"></span><div class="step-top"><h3>${s.name}</h3><time>${s.date}</time></div><p>${s.detail}</p><div class="actions">${s.action}</div></li>`).join('')}</ol></div></section>`}
 function documents(){return `<section class="section"><div class="section-head"><div><h2>Documents & email</h2><p>Review recipients and the email before sending.</p></div></div><div class="table-scroll"><table><thead><tr><th>Document</th><th>When to send</th><th>Delivery</th><th>Action</th></tr></thead><tbody>${[['contract','Hosting contract','Final numbers approved'],['deposit','Deposit invoice','Before Oct 9'],['rental','Rental invoice','Due Oct 18'],['receipt','Payment receipt','After recording payment'],['refund','Refund confirmation','After returning deposit']].map(([id,name,date])=>`<tr><td><strong>${name}</strong><p>${id==='contract'?'Revision 1':id==='deposit'?'$300 deposit':id==='rental'?'$1,400 rental fee':id==='receipt'?money(state.rental)+' received':'$300 security deposit'}</p></td><td>${date}</td><td>${state.docs.has(id)?'Sent':'Not sent'}</td><td><button class="text" data-action="preview-${id}">Preview email</button></td></tr>`).join('')}</tbody></table></div></section>`}
 const emailTypes={contract:['Please sign: October 16 hosting agreement','Review your hosting agreement','Please review and sign the hosting agreement for your October 16 event. Your personal link opens the full agreement and takes you to your signature fields.','Review & sign agreement'],reminder:['Reminder: your hosting agreement needs a signature','A quick reminder to sign','We are still waiting for your signature on the October 16 hosting agreement. Please use your personal link below to review and sign.','Review & sign agreement'],deposit:['Security deposit invoice · October 16 event','Security deposit invoice','Your $300 security deposit is due October 9. The attached invoice includes the payment details.','View deposit invoice'],rental:['Rental invoice · October 16 event','Rental payment invoice','The rental fee for your October 16 event is $1,400, due October 18. The attached invoice includes the payment details.','View rental invoice'],receipt:['Payment received · October 16 event','Thank you for your payment',()=>`We have recorded ${money(state.rental)} in rental payments for your October 16 event. Your current remaining rental balance is ${money(Math.max(0,1400-state.rental))}.`,'View payment receipt'],refund:['Deposit return · October 16 event','Security deposit returned','This email confirms the return of your $300 security deposit. The attached document records the refund.','View refund confirmation']};
 function email(){const id=state.email;const [subject,title,copy,action]=emailTypes[id];return `<section class="section email-section" id="email-preview"><div class="section-head"><div><h2>Email preview</h2><p>From Theta Xi Hosting · host@cal.taxi</p></div><label><span class="small muted">Message </span><select class="email-select" id="email-type" aria-label="Email to preview">${Object.entries(emailTypes).map(([key,v])=>`<option value="${key}" ${key===id?'selected':''}>${{contract:'Contract invitation',reminder:'Signing reminder',deposit:'Deposit invoice',rental:'Rental invoice',receipt:'Payment receipt',refund:'Refund confirmation'}[key]}</option>`).join('')}</select></label></div><div class="email-shell"><div class="email-meta"><strong>From:</strong> Theta Xi Hosting &lt;host@cal.taxi&gt;<br><strong>To:</strong> ${safe(id==='contract'?'Each signer separately':id==='reminder'?'Sam Patel <person3@example.test>':'Event billing contact <billing@example.test>')}<br><strong>Subject:</strong> ${subject}</div><article class="email-paper"><div class="mail-brand">Theta Xi Hosting</div><h3>${title}</h3><p>Hi ${id==='contract'?'Sam':id==='reminder'?'Sam':'Alex'},</p><p>${typeof copy==='function'?copy():copy}</p><div class="mail-details"><strong>Robotics Club · October 16, 2026</strong><br>7:00–11:00 PM · Theta Xi Fraternity House<br>Rental fee: $1,400 · Refundable deposit: $300</div><a class="mail-button" href="#" data-action="sample-link">${action}</a><p>${id==='contract'||id==='reminder'?'This signing link is personal to you. Everyone will receive the completed contract once all representatives have signed.':'If you have a question about the document or payment, simply reply to this email.'}</p><div class="signature"><strong>The Hosting Team</strong><br>Theta Xi · Nu Chapter<br>University of California, Berkeley<br><a href="mailto:host@cal.taxi">host@cal.taxi</a> · <a href="https://cal.taxi">cal.taxi</a></div>${!['contract','reminder'].includes(id)?`<div class="attachments">Attachment: ${id}-october-16.pdf (sample)</div>`:''}</article><p class="email-disclaimer">Sample email only. Sender setup and document delivery have not been configured.</p></div><div class="section-body actions">${id==='reminder'?btn('Remind unsigned signers','remind',true,!state.sent||state.count===5||state.cancelled):btn(id==='contract'?'Send contract to all signers':id==='refund'?'Confirm deposit returned & send':'Send '+{deposit:'deposit invoice',rental:'rental invoice',receipt:'payment receipt'}[id],'send-'+id,true,state.cancelled||(id==='receipt'&&state.rental===0)||(id==='refund'&&state.rental<1400))}<span class="small muted">Simulated in this preview.</span></div></section>`}
 function render(){
